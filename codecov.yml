codecov:
  notify:
    after_n_builds: 2
    wait_for_ci: true

comment:
  layout: "header, diff, flags, files, footer"
  behavior: once
  require_changes: true
  require_base: true
  require_head: true
  hide_project_coverage: false
  after_n_builds: 2

coverage:
  status:
    project:
      default: false
      rust:
        flags: [rust]
        informational: true
      cli:
        flags: [cli]
        informational: true
    patch:
      default: false
      rust:
        flags: [rust]
        informational: true
      cli:
        flags: [cli]
        informational: true

flags:
  rust:
    paths:
      - crates/aix/src/
      - crates/aix-pack/src/
      - crates/aix-web/src/
    carryforward: false
  cli:
    paths:
      - packages/cli/src/
    carryforward: false
