[package]
name = "aiui-aix-web"
version = "0.10.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
aix = { package = "aiui-aix", path = "../aix", features = ["wasm"] }
aix-pack = { package = "aiui-aix-pack", path = "../aix-pack" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
anyhow = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"
# The coverage job pins LLVM 21; minicov 0.3.9 uses LLVM 23's profile layout.
minicov = "=0.3.8"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]
