[package]
name = "aiui-aix"
version = "0.10.1"
edition = "2021"
description = "Core Rust library for reading and analyzing AIX packages for AI agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jsar-project/aix"
homepage = "https://jsar-project.github.io/aix/"
documentation = "https://jsar-project.github.io/aix/spec"
keywords = ["aix", "ai", "agent", "package", "archive"]
categories = ["encoding", "parser-implementations"]

[lib]
crate-type = ["lib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
anyhow = { version = "1", default-features = false }
rawzip = { version = "0.5.1", default-features = false, features = ["alloc"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more", "allocator-api2", "serde"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc", "zeroize", "rand_core"] }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
semver = { version = "1", default-features = false }

[features]
default = ["std"]
std = ["anyhow/std", "serde/std", "serde_json/std", "semver/std"]
wasm = ["wasm-bindgen", "js-sys", "serde-wasm-bindgen"]

[dev-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
criterion = "0.5"

[[bench]]
name = "read"
harness = false
