[package]
name = "aiui-aix-cli"
version = "0.9.0"
edition = "2021"
description = "Command-line tool for packing, validating, and inspecting AIX artifacts"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jsar-project/aix"
homepage = "https://jsar-project.github.io/aix/"
documentation = "https://jsar-project.github.io/aix/packages"
keywords = ["aix", "ai", "agent", "cli", "package"]
categories = ["command-line-utilities"]

[[bin]]
name = "aix"
path = "src/main.rs"

[dependencies]
aix = { package = "aiui-aix", path = "../aix", version = "0.9.0" }
aix-pack = { package = "aiui-aix-pack", path = "../aix-pack", version = "0.9.0" }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
uuid = { version = "1.0", features = ["v4"] }
anyhow = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
