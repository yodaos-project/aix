name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  native-tests:
    name: Native Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run native unit tests
        run: cargo test -p aiui-aix -p aiui-aix-pack

  wasm-check:
    name: WASM Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check WASM target
        run: cargo check -p aiui-aix-web --target wasm32-unknown-unknown

  npm-cli:
    name: npm CLI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/cli/package-lock.json
            crates/aix-web/package-lock.json

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Build npm CLI
        working-directory: packages/cli
        run: npm run build

      - name: Smoke test
        working-directory: packages/cli
        run: node dist/cli.js --help

      - name: Test source checks
        working-directory: packages/cli
        run: npm test

      - name: Install Web SDK dependencies
        working-directory: crates/aix-web
        run: npm ci

      - name: Build Web SDK
        working-directory: crates/aix-web
        run: npm run build

      - name: Install Chromium
        working-directory: crates/aix-web
        run: npx playwright install --with-deps chromium

      - name: Test browser SDK and CLI parity
        working-directory: crates/aix-web
        run: npm test
