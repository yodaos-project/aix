name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  native-tests:
    name: Native Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run native unit tests
        run: cargo test -p aiui-aix -p aiui-aix-pack

  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Collect Rust coverage
        run: bash scripts/coverage-rust.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Summarize Rust coverage
        run: node scripts/coverage-summary.cjs rust coverage/rust/coverage-summary.json

      - name: Upload Rust coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: coverage/rust/
          if-no-files-found: error
          retention-days: 14

  wasm-check:
    name: WASM Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check WASM target
        run: cargo check -p aiui-aix-web --target wasm32-unknown-unknown

  npm-cli:
    name: npm CLI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/cli/package-lock.json
            crates/aix-web/package-lock.json

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Build and test npm CLI with coverage
        working-directory: packages/cli
        run: npm run test:coverage

      - name: Summarize CLI coverage
        run: node scripts/coverage-summary.cjs cli packages/cli/coverage/coverage-summary.json

      - name: Upload CLI coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-coverage
          path: |
            packages/cli/coverage/
            !packages/cli/coverage/tmp/
          if-no-files-found: error
          retention-days: 14

      - name: Smoke test
        working-directory: packages/cli
        run: node dist/cli.js --help

      - name: Install Web SDK dependencies
        working-directory: crates/aix-web
        run: npm ci

      - name: Build Web SDK
        working-directory: crates/aix-web
        run: npm run build

      - name: Install Chromium
        working-directory: crates/aix-web
        run: npx playwright install --with-deps chromium

      - name: Test browser SDK and CLI parity
        working-directory: crates/aix-web
        run: npm test
