name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish
        required: true
        default: all
        type: choice
        options:
          - aiui-aix
          - aiui-aix-pack
          - aiui-aix-web
          - all
      dry_run:
        description: Run cargo publish --dry-run instead of publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run baseline tests
        run: cargo test -p aiui-aix -p aiui-aix-pack

      - name: Ensure crates.io token is configured
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Missing CARGO_REGISTRY_TOKEN secret" >&2
            exit 1
          fi

      - name: Publish selected crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SELECTED_CRATE: ${{ inputs.crate }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          for crate in aiui-aix aiui-aix-pack aiui-aix-web; do
            if [ "$SELECTED_CRATE" != "all" ] && [ "$SELECTED_CRATE" != "$crate" ]; then
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              cargo publish -p "$crate" --dry-run
            else
              cargo publish -p "$crate"
              if [ "$crate" != "aiui-aix-web" ]; then
                sleep 30
              fi
            fi
          done
